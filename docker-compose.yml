services:
  db:
    image: postgres:16-alpine
    container_name: docshare-db
    restart: unless-stopped
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: docshare
      POSTGRES_PASSWORD: docshare
      POSTGRES_DB: docshare
    volumes:
      - docshare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docshare -d docshare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  docshare_pgdata:
